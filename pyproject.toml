[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "v2text"
version = "0.1.0"
description = "Private, offline-first push-to-talk voice dictation for desktop"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "faster-whisper>=1.0",
  "sounddevice>=0.4",
  "pynput>=1.7",
  "pyperclip>=1.8",
]

[project.optional-dependencies]
ai = ["anthropic>=2.8"]
dev = ["pytest>=8", "anthropic>=2.8"]

[project.scripts]
v2text = "v2text.cli:main"

[tool.setuptools]
packages = ["v2text"]
